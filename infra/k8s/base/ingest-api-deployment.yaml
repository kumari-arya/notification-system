apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingest-api }
  template:
    metadata:
      labels: { app: ingest-api }
    spec:
      containers:
        - name: ingest-api
          image: notification-system/ingest-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
spec:
  type: NodePort
  selector: { app: ingest-api }
  ports:
    - port: 3000
      targetPort: 3000
