apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'ingest-api'
        static_configs:
          - targets: ['ingest-api:3000']

      - job_name: 'worker'
        static_configs:
          - targets: ['worker-metrics:3001']
